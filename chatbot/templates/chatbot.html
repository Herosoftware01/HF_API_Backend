<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hero Fashion - AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
{% load static %}
<style>
/* Reset and Variables from reference */
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#25D366;--green-dark:#128C7E;--sent-bg:#d9fdd3;--bg:#f0f2f5;--white:#fff;--border:#e9edef;--text:#111;--text2:#667781;--hover:#f5f6f6;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;justify-content:center;align-items:center;}

.app-container { width: 100%; max-width: 900px; height: 95vh; background: var(--white); border-radius: 12px; box-shadow: 0 12px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); }

/* Header */
.chat-header { display: flex; align-items: center; gap: 15px; padding: 12px 20px; background: var(--white); border-bottom: 1px solid var(--border); }
.chat-header-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #25D366, #128C7E); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
.chat-header-info { flex: 1; }
.chat-header-name { font-size: 16px; font-weight: 600; color: var(--text); }
.chat-header-sub { font-size: 13px; color: var(--green); margin-top: 2px; }

/* Messages Area */
.messages-area { flex: 1; padding: 20px; background: #efeae2; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.messages-area::-webkit-scrollbar { width: 6px; }
.messages-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

/* Message Rows */
.msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 80%; animation: fadeIn 0.3s ease; }
.msg-row.sent { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.recv { align-self: flex-start; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--green-dark); flex-shrink: 0; font-size: 18px; }
.msg-bubble { padding: 10px 15px; border-radius: 12px; font-size: 14.5px; line-height: 1.5; color: var(--text); position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.msg-row.sent .msg-bubble { background: var(--sent-bg); border-bottom-right-radius: 4px; }
.msg-row.recv .msg-bubble { background: var(--white); border-bottom-left-radius: 4px; }

.msg-meta { font-size: 11px; color: var(--text2); margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }

/* Input Area */
.input-row { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--white); border-top: 1px solid var(--border); }
.msg-input-container { flex: 1; background: var(--bg); border-radius: 24px; display: flex; align-items: center; padding: 4px 16px; border: 1px solid transparent; transition: border 0.3s; }
.msg-input-container:focus-within { border-color: var(--green); background: var(--white); box-shadow: 0 0 0 2px rgba(37, 211, 102, 0.1); }
.msg-input { width: 100%; border: none; background: transparent; padding: 10px 0; font-size: 15px; outline: none; color: var(--text); }
.send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--green); border: none; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s, opacity 0.2s; flex-shrink: 0; }
.send-btn:hover { opacity: 0.9; }
.send-btn:active { transform: scale(0.95); }

/* Data tables and cards inside msg-bubble */
.data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; background: var(--white); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.data-table th, .data-table td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
.data-table th { background: var(--bg); font-weight: 600; color: var(--text2); }
.data-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 10px; }
.data-card-item { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13.5px; }
.data-card-label { font-weight: 600; color: var(--text2); }

/* Typing Indicator */
.typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
.typing-dot { width: 6px; height: 6px; background: var(--text2); border-radius: 50%; animation: typing 1.4s infinite ease-in-out; opacity: 0.7; }
.typing-dot:nth-child(1) { animation-delay: 0s; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
</style>
</head>
<body>

<div class="app-container">
    <div class="chat-header">
        <div class="chat-header-avatar">
            <i class="ti ti-robot"></i>
        </div>
        <div class="chat-header-info">
            <div class="chat-header-name">Hero Fashion AI Assistant</div>
            <div class="chat-header-sub">Online &middot; Ready to help</div>
        </div>
    </div>

    <div class="messages-area" id="chat-messages">
        <!-- Initial Message -->
        <div class="msg-row recv">
            <div class="msg-avatar"><i class="ti ti-robot"></i></div>
            <div class="msg-bubble">
                Hello! 👋 I can help you with buyers, orders, and sales data.<br>
                <small style="color:var(--text2); margin-top:5px; display:block;">Try: "Show buyers", "Create an order", or simply say "Hi!"</small>
            </div>
        </div>
    </div>

    <form id="chat-form" class="input-row">
        {% csrf_token %}
        <div class="msg-input-container">
            <input type="text" id="chat-input" class="msg-input" placeholder="Type your message here..." required autocomplete="off">
        </div>
        <button type="submit" id="send-btn" class="send-btn">
            <i class="ti ti-send"></i>
        </button>
    </form>
</div>

<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
