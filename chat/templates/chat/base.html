<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}ChatApp{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#25D366;--green-dark:#128C7E;--sent-bg:#d9fdd3;--bg:#f0f2f5;--white:#fff;--border:#e9edef;--text:#111;--text2:#667781;--hover:#f5f6f6;--radius:12px;--purple:#7F77DD;--blue:#378ADD}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* Layout */
.app-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:360px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--white);flex-shrink:0}
.main-panel{flex:1;display:flex;flex-direction:column;background:var(--bg)}

/* Sidebar Header */
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--white);border-bottom:1px solid var(--border)}
.sidebar-header-left{display:flex;align-items:center;gap:10px}
.sidebar-title{font-size:20px;font-weight:600;color:var(--green-dark)}
.header-actions{display:flex;gap:6px}
.icon-btn{border:none;background:none;padding:6px;border-radius:50%;cursor:pointer;color:var(--text2);font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.icon-btn:hover{background:var(--hover)}

/* Search */
.search-wrap{padding:8px 12px;background:var(--white);border-bottom:1px solid var(--border)}
.search-inner{position:relative}
.search-inner input{width:100%;padding:8px 12px 8px 36px;border-radius:20px;border:none;background:var(--bg);font-size:14px;color:var(--text);outline:none}
.search-inner i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:16px}

/* Chat List */
.chat-list{flex:1;overflow-y:auto}
.chat-list::-webkit-scrollbar{width:4px}
.chat-list::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.chat-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.chat-item:hover,.chat-item.active{background:var(--hover)}
.chat-item-info{flex:1;min-width:0}
.chat-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.chat-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:var(--text2);flex-shrink:0;margin-left:8px}
.chat-preview{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:space-between}
.unread-badge{background:var(--green);color:#fff;font-size:11px;font-weight:500;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0;margin-left:6px}

/* Avatar */
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0}
.avatar-placeholder{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;flex-shrink:0;font-size:14px}
.online-wrap{position:relative;flex-shrink:0}
.online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;background:#25D366;border-radius:50%;border:2px solid #fff}
.offline-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;background:#ccc;border-radius:50%;border:2px solid #fff}

/* Empty state */
.empty-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:12px;background:var(--bg)}
.empty-panel i{font-size:56px;opacity:.25}
.empty-panel p{font-size:15px}

/* Buttons */
.btn{padding:8px 18px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{opacity:.9}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:8px;font-size:14px}
.btn-outline:hover{background:var(--hover)}

/* Forms */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px}
.form-control{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--white);outline:none;transition:border .15s}
.form-control:focus{border-color:var(--green)}
.form-error{font-size:12px;color:#e24b4a;margin-top:4px}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--white)}
.tab-btn{flex:1;padding:10px;border:none;background:none;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab-btn.active{color:var(--green-dark);border-bottom-color:var(--green)}

/* Alerts */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.alert-error{background:#fcebeb;color:#a32d2d;border:1px solid #f09595}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
