{% extends 'chat/base.html' %}
{% block title %}Login — ChatApp{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5">
  <div style="background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;border:1px solid #e9edef">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:56px;height:56px;background:#25D366;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
        <i class="ti ti-message-2" style="font-size:28px;color:#fff"></i>
      </div>
      <h1 style="font-size:22px;font-weight:600;color:#111">Welcome back</h1>
      <p style="font-size:14px;color:#667781;margin-top:4px">Sign in to your account</p>
    </div>
    {% if form.errors %}
    <div class="alert alert-error">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input name="username" class="form-control" placeholder="Enter username" autofocus/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input name="password" type="password" class="form-control" placeholder="Enter password"/>
      </div>
      <button type="submit" class="btn btn-green" style="width:100%;padding:11px;font-size:15px">Sign In</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:13px;color:#667781">
      No account? <a href="{% url 'register' %}" style="color:#128C7E;font-weight:500">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
